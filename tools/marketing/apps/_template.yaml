# 새 앱 프로필 양식. 복사해서 apps/<앱 id>.yaml 로 저장하고 값만 채운다 (파일 이름 = id).
# 템플릿(templates/*.yaml, variations.py)은 앱 값을 {{app.<경로>}} 로 읽으므로, 여기만 채우면 어떤 앱에도 동작한다.
id: my_app                      # copy/<id>.yaml 이 기본 카피 파일
name: "앱 이름"                 # 카피에서 {{app.name}} 으로 쓸 수 있다
language: ko                    # 설명용. 글꼴 선택(font)과 카피 말투(register)의 기준
register: honorific             # 설명용 (honorific 존댓말 / plain 반말 등). 카피 작성 규칙
font: system_sd_gothic          # template/fonts.py 의 FONT_FILES 키 (한글이 아니면 해당 언어 글꼴을 등록)
shots_dir: assets/shots/my_app/ko   # 스크린샷 폴더 (tools/marketing 기준). 파일 이름순으로 0번부터
brand:
  primary: "#4F46E5"            # 브랜드 주색 (텍스트 전용 장 배경, 다크 스타일 강조)
  accent: "#3730A3"             # 밝은 배경 위 강조어 색 (대비 확인)
  # on_dark: 생략하면 규칙으로 만든다 (primary 를 #161616 위 4.5:1 이 될 때까지 흰색 쪽으로 10%씩 섞음, template/checks.py)
  logo: logo_my_app.png         # assets/ 아래 파일 (정사각 PNG)
# 화면 레지스트리: 이름 -> 스크린샷 번호와 선택적 크롭 [x0,y0,x1,y1] (원본 대비 0~1 비율)
screens:
  home: {shot: 0}
  home_top: {shot: 0, crop: [0, 0, 1, 0.6]}
