# 앱 프로필: 이 앱에만 해당하는 값(이름, 브랜드 색, 로고, 글꼴, 스크린샷 폴더, 화면 레지스트리). 템플릿은 {{app.*}} 자리표시자로 이 값을 읽는다.
# screens: 이름 -> 스크린샷 번호(shots_dir 의 파일 이름순)와 선택적 크롭 [x0,y0,x1,y1] (원본 대비 비율, 눈으로 잰 값).
#   0 목록(6건) / 1 추가 입력 중 / 2 수정 / 3 달력 / 4 저장 후 목록(맨 아래에 새 메모). extraN 은 기존 4종 템플릿 크롭에서 옮긴 것.
