# Central release configuration for SpiralDailyDev monorepo
pipeline:
  defaultEnv:
    flutterChannel: stable
    flutterVersion: "3.41.2"
  artifactRoot: artifacts
  fastlaneBinary: bundle exec fastlane
  enableNotifications: false
apps:
  adage_spark:
    appId: com.spiraldev.adage_spark
    iosBundleId: com.spiraldev.adageSpark
    displayName: "Adage Spark"
    projectPath: apps/adage_spark
    metadata:
      android: store_metadata/adage_spark/android.yaml
      ios: store_metadata/adage_spark/ios.yaml
    autoGenerateIcon: false
    autoCaptureScreenshots: false
    build:
      android:
        command:
          - flutter
          - build
          - appbundle
          - --release
      ios:
        command:
          - flutter
          - build
          - ipa
          - --release
    fastlane:
      androidLane: android_play_production
      iosLane: ios_appstore_release
  daily_memo:
    appId: com.spiral_daily_dev.apps.daily_memo
    iosBundleId: com.spiraldailydev.dailyMemo
    displayName: "Daily Memo"
    projectPath: apps/daily_memo
    metadata:
      android: store_metadata/daily_memo/android.yaml
      ios: store_metadata/daily_memo/ios.yaml
    autoGenerateIcon: true
    autoCaptureScreenshots: false
    icon:
      output: artifacts/daily_memo/app_icon.png
      backgroundColor: "#3E4A89"
      label: "DM"
      labelColor: "#FFFFFF"
      fontSize: 420
    screenshots:
      outputPath: artifacts/daily_memo/screenshots
      scenarios:
        - name: onboarding
          description: "Capture the onboarding flow using integration tests."
          command:
            - flutter
            - drive
            - --driver=test_driver/integration_test.dart
            - --target=integration_test/onboarding_flow.dart
    build:
      android:
        command:
          - flutter
          - build
          - appbundle
          - --release
      ios:
        command:
          - flutter
          - build
          - ipa
          - --release
    fastlane:
      androidLane: android_play_production
      iosLane: ios_appstore_release
  film_archive:
    appId: com.spiraldev.film_archive_2
    iosBundleId: com.spiraldev.filmArchive
    displayName: "Film Archive"
    projectPath: apps/film_archive
    metadata:
      android: store_metadata/film_archive/android.yaml
      ios: store_metadata/film_archive/ios.yaml
    autoGenerateIcon: false
    autoCaptureScreenshots: false
    build:
      android:
        command:
          - flutter
          - build
          - appbundle
          - --release
      ios:
        command:
          - flutter
          - build
          - ipa
          - --release
    fastlane:
      androidLane: android_play_production
      iosLane: ios_appstore_release
  luck_insight:
    appId: com.spiraldev.luck_insight
    iosBundleId: com.spiraldev.luckInsight
    displayName: "Luck Insight"
    projectPath: apps/luck_insight
    metadata:
      android: store_metadata/luck_insight/android.yaml
      ios: store_metadata/luck_insight/ios.yaml
    autoGenerateIcon: false
    autoCaptureScreenshots: false
    build:
      android:
        command:
          - flutter
          - build
          - appbundle
          - --release
      ios:
        command:
          - flutter
          - build
          - ipa
          - --release
    fastlane:
      androidLane: android_play_production
      iosLane: ios_appstore_release
  spiral_trade_show:
    appId: com.spiral.trade_show.spiral_trade_show
    iosBundleId: com.spiral.tradeshow.spiralTradeShow
    displayName: "Spiral Trade Show"
    projectPath: apps/spiral_trade_show
    metadata:
      android: store_metadata/spiral_trade_show/android.yaml
      ios: store_metadata/spiral_trade_show/ios.yaml
    autoGenerateIcon: false
    autoCaptureScreenshots: true
    icon:
      output: artifacts/spiral_trade_show/app_icon.png
      source: assets/spiral_trade_show/icon.png
    screenshots:
      outputPath: artifacts/spiral_trade_show/screenshots
      scenarios:
        - name: exhibitions
          description: "Scroll through the exhibitions list."
          command:
            - flutter
            - drive
            - --driver=test_driver/integration_test.dart
            - --target=integration_test/exhibitions_flow.dart
    build:
      android:
        command:
          - flutter
          - build
          - appbundle
          - --release
      ios:
        command:
          - flutter
          - build
          - ipa
          - --release
    fastlane:
      androidLane: android_play_production
      iosLane: ios_appstore_release
  world_field_guide:
    appId: com.spiraldev.world_field_guide
    iosBundleId: com.spiraldev.worldFieldGuide
    displayName: "World Field Guide"
    projectPath: apps/world_field_guide
    metadata:
      android: store_metadata/world_field_guide/android.yaml
      ios: store_metadata/world_field_guide/ios.yaml
