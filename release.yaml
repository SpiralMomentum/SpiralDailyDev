          - --release
      ios:
        command:
          - flutter
          - build
          - ipa
          - --release
    fastlane:
      androidLane: android_play_production
      iosLane: ios_appstore_release
  world_of_beast:
    appId: com.spiraldev.world_of_beast
    iosBundleId: com.spiraldev.worldOfBeast
    displayName: "World of Beast"
    projectPath: apps/world_of_beast
    metadata:
      android: store_metadata/world_of_beast/android.yaml
      ios: store_metadata/world_of_beast/ios.yaml
    autoGenerateIcon: false
    autoCaptureScreenshots: false
    build:
      android:
        command:
          - flutter
          - build
          - appbundle
          - --release
      ios:
        command:
          - flutter
          - build
          - ipa
          - --release
    fastlane:
      androidLane: android_play_production
      iosLane: ios_appstore_release
