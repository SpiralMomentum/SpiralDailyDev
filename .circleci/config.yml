version: '2.1'

setup: true

orbs:
  path-filtering: circleci/path-filtering@0.1.4
  continuation: circleci/continuation@1.0.0


#jobs:
#  build-release-aab:
#  build-release-ipa:
#  flutter-smoke-test:
#  flutter-integration-test:
#  deploy-to-google-play-store:
#  deploy-to-app-store:


parameters:
  daily-memo-manual-deploy:
    type: boolean
    default: false
  exchange-calculator-manual-deploy:
    type: boolean
    default: false

workflows:
  setup-ci-cd:
    jobs:
      - path-filtering/filter:
          name: Setup CI/CD
          config-path: .circleci/continue-config.yml
          base-revision: develop
          mapping: |
            apps/daily_memo/.* service-root-path "apps/daily_memo"
            apps/exchange_rate_calculator/.* service-root-path "apps/exchange_rate_calculator"
            /.* daily_memo_trigger <<pipeline.parameters.daily-memo-manual-deploy >>
            /.* exchange_calculator_trigger <<pipeline.parameters.exchange-calculator-manual-deploy >>
