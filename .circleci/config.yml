version: '2.1'

setup: true

orbs:
  path-filtering: circleci/path-filtering@0.1.4
  continuation: circleci/continuation@1.0.0

parameters:
  daily-memo-deploy:
    type: boolean
    default: false
  exchange-calculator-deploy:
    type: boolean
    default: false

jobs:
  set-continuation-key:
    macos:
      xcode: 14.2.0
    steps:
      - run: echo ${CIRCLE_BRANCH}
      - run:
          command: |
            if [ -z "$CIRCLE_PR_NUMBER" ]; then
                if [[ $CIRCLE_BRANCH =~ .*pull.* ]]; then
                    PR_NUMBER=$(echo $CIRCLE_BRANCH | sed 's/[^0-9]//g')
                    echo "export CIRCLE_PR_NUMBER=$PR_NUMBER" >> $BASH_ENV
                fi
            fi
      - run:
          command: echo ${CIRCLE_PR_NUMBER}
            

workflows:
  setup-ci-cd:
#    unless:
#      or: [ << pipeline.parameters.daily-memo-deploy >>, << pipeline.parameters.exchange-calculator-deploy >> ]
    jobs:
      - set-continuation-key
      - path-filtering/filter:
          name: Setup CI/CD
          config-path: .circleci/continue-config.yml
          base-revision: master
          mapping: |
            apps/daily_memo/.* service-root-path "apps/daily_memo"
            apps/exchange_rate_calculator/.* service-root-path "apps/exchange_rate_calculator"
