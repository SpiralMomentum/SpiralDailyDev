version: '2.1'

orbs:
  flutter: circleci/flutter@2.0.2

parameters:
  is-pr:
    type: boolean
    default: true
  service-root-path:
    type: string
    default: ""

#  daily_memo_ci_run:
#    type: boolean
#    default: false
#  exchange_calculator_ci_run:
#    type: boolean
#    default: false

jobs:
  flutter-unit-test:
    macos:
      xcode: 14.2.0
    name: 유닛 테스트
    steps:
      - checkout
      - flutter/install_sdk:
          version: 3.3.10
      - run: cd << pipeline.parameters.service-root-path >> && flutter test

      # TODO: add step to check test coverage
      # TODO: make all steps as shell command

  flutter-static-analysis:
    macos:
      xcode: 14.2.0
    name: 정적 분석
    steps:
      - checkout
      - flutter/install_sdk:
          version: 3.3.10
      - run: cd << pipeline.parameters.service-root-path >>
      # TODO: add step to check flutter analyze
      # TODO: make all steps as shell command

  flutter-build-binary:
    macos:
      xcode: 14.2.0
    name: 빌드 바이너리
    steps:
      - checkout
      - flutter/install_sdk:
          version: 3.3.10
      - run: flutter pub global activate melos 2.9.0
      - run: flutter pub global run melos bootstrap
      - run: cd << pipeline.parameters.service-root-path >> && flutter pub global run melos exec -- flutter clean && flutter pub global run melos exec -- flutter build aab --release
      - run: cd << pipeline.parameters.service-root-path >> && flutter pub global run melos exec -- flutter clean && flutter pub global run melos exec -- flutter build ipa --release

workflows:
  exchange-cal-app-ci-workflow:
    when: << pipeline.parameters.exchange_calculator_ci_run >>
    jobs:
      - flutter-unit-test
      - flutter-static-analysis
      - flutter-build-binary:
          requires:
            - not: << pipeline.parameters.is-pr >>
            - flutter-unit-test
            - flutter-static-analysis
