version: '2.1'

orbs:
  android: circleci/android@1.0.3
  flutter: circleci/flutter@2.0.2

parameters:
  daily_memo_deploy:
    type: boolean
    default: true
  service-root-path:
    type: string
    default: ""

jobs:
  android-deploy:
    executor:
      name: android/android-machine
      resource-class: medium
    steps:
      - checkout
      - flutter/install_sdk:
          version: 3.10.6
      - run:
          name: Install Fastlane
          command: gem install fastlane
      - run:
          command: echo -n $GOOGLE_SERVICE_JSON | base64 --decode > apps/daily_memo/android/app/google-services.json
      - run:
          command: flutter build appbundle
          working_directory: << pipeline.parameters.service-root-path >>
      - run:
          command: echo -n $PLAYSTORE_KEY_STORE | base64 --decode > apps/daily_memo/keystore.jks
      - run:
          command: jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore apps/daily_memo/keystore.jks -storepass MorethanMore1! -keypass MorethanMore1! apps/daily_memo/build/app/outputs/bundle/release/app-release.aab spiral
      - run:
          command: echo -n $GOOGLE_PLAYSTORE_API_KEY_JSON | base64 --decode > apps/daily_memo/android/google_playstore_api_key.json
      - run:
          command: fastlane run supply aab:apps/daily_memo/build/app/outputs/bundle/release/app-release.aab track:production json_key:apps/daily_memo/android/google_playstore_api_key.json package_name:com.spiral_daily_dev.apps.daily_memo

workflows:
  daily-memo-deploy-workflow:
    jobs:
      - android-deploy
