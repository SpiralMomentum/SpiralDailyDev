version: '2.1'

orbs:
  android: circleci/android@1.0.3
  flutter: circleci/flutter@2.0.2

parameters:
  daily_memo_deploy:
    type: boolean
    default: true
  service-root-path:
    type: string
    default: ""

jobs:
  android-deploy:
    executor:
      name: android/android-machine
      resource-class: medium
    steps:
      - checkout
      - flutter/install_sdk:
          version: 3.10.6
      - run:
          name: Install Fastlane
          command: gem install fastlane
      - run:
          command: echo -n $GOOGLE_SERVICE_JSON | base64 --decode > android/app/google-services.json
          working_directory: << pipeline.parameters.service-root-path >>
      - run:
          command: flutter build appbundle
          working_directory: << pipeline.parameters.service-root-path >>
      - run:
          name: Build and Deploy to Google Play
          command: cd  << pipeline.parameters.service-root-path >>/android && fastlane supply aab:../build/app/outputs/bundle/release/app-release.aab track:production json_key:app/google-services.json

workflows:
  daily-memo-deploy-workflow:
    jobs:
      - android-deploy
