name: self_eval_sim
description: "선택지 기반 자기평가와 누적 발현을 제공하는 온디바이스 시뮬레이션 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  equatable: ^2.0.5
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  image: ^4.5.4
  utils:
    path: ../../packages/utils
  flutter_gemma: 0.16.5
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/content/strings/
    - assets/narration/
    - assets/story/wuxia/
    - assets/images/scenes/
