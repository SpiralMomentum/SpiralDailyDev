name: apps.map_switcher
description: Multi-provider map experience leveraging shared SpiralDailyDev infrastructure.

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  go_router: ^12.1.1
  app_navigation:
    path: ../../packages/app_navigation
  ui_components:
    path: ../../packages/ui_components
  utils:
    path: ../../packages/utils
  flutter_map: ^5.1.0
  latlong2: ^0.9.0
  naver_map_plugin: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
