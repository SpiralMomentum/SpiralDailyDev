name: quote_companion
description: Inspirational quote companion service with a curated dashboard experience.
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  equatable: ^2.0.5
  flutter_riverpod: ^2.4.9
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  uuid: ^4.2.1
  ui_components:
    path: ../../packages/ui_components

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/curated_quotes.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/launcher/lineup_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
