    title: "환율 변환기"
    shortDescription: |
      실시간 환율 조회와 통화 변환.
    fullDescription: |
      환율 변환기는 최신 데이터를 기반으로 다양한 통화를 빠르게 변환해주는 앱입니다.
      통화 즐겨찾기와 히스토리 그래프를 통해 학습에도 활용해 보세요.
