# Template for store metadata definitions.
# Copy this file into each app folder and replace the placeholder values.
appName: "${APP_NAME}"
shortDescription: |
  ${SHORT_DESCRIPTION}
fullDescription: |
  ${FULL_DESCRIPTION}
category:
  primary: Productivity
  secondary: Utilities
contact:
  email: support@example.com
  website: https://example.com
  phone: "+82-00-0000-0000"
privacyPolicyUrl: https://example.com/privacy
releaseNotes:
  default: |
    - Initial release.
  locales:
    ko-KR: |
      - 초기 출시.
    en-US: |
      - Initial release.
keywords:
  - placeholder
screenshots:
  phone:
    - path: ./screenshots/phone_1.png
      description: "Main screen"
  tablet: []
icons:
  primary: ./icon.png
localizations:
  - locale: ko-KR
    title: "${APP_NAME_KO}"
    shortDescription: |
      ${SHORT_DESCRIPTION_KO}
    fullDescription: |
      ${FULL_DESCRIPTION_KO}
