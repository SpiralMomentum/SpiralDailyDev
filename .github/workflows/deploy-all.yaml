name: Deploy All (Android + iOS)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App name (release.yaml에 등록된 snake_case 이름)"
        required: true
        type: string
      android_track:
        description: "Play Store track"
        required: true
        type: choice
        options:
          - internal
          - production
      ios_target:
        description: "iOS deployment target"
        required: true
        type: choice
        options:
          - testflight
          - appstore

jobs:
  android:
    uses: ./.github/workflows/deploy-android.yaml
    with:
      app: ${{ inputs.app }}
      track: ${{ inputs.android_track }}
    secrets: inherit

  ios:
    uses: ./.github/workflows/deploy-ios.yaml
    with:
      app: ${{ inputs.app }}
      target: ${{ inputs.ios_target }}
    secrets: inherit
