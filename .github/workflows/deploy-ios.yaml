name: Deploy iOS

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App name (release.yaml에 등록된 snake_case 이름)"
        required: true
        type: string
      target:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - testflight
          - appstore
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      target:
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app name
        run: python3 -c "import yaml,sys; assert '${{ inputs.app }}' in yaml.safe_load(open('release.yaml'))['apps'], f'Unknown app: ${{ inputs.app }}'"

  deploy:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          sudo rm -f /usr/local/bin/pod /usr/local/bin/xcodeproj
          brew uninstall cocoapods 2>/dev/null || true
          gem install cocoapods --no-document
          which pod
          pod --version

      - name: Setup SSH for match
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Deploy to ${{ inputs.target }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: python3 tools/pipeline/pipeline.py deploy --app ${{ inputs.app }} --platform ios --target ${{ inputs.target }}
