name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate paths-filter config
        run: python3 tools/pipeline/detect_changes.py > /tmp/filters.yml

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: /tmp/filters.yml

  # ── 공유 패키지 테스트 ──────────────────────────────
  test-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Test utils (with coverage)
        run: flutter test --coverage
        working-directory: packages/utils

      - name: Test networking (with coverage)
        run: dart test --coverage=coverage
        working-directory: packages/networking

      - name: Test app_logging (with coverage)
        run: dart test --coverage=coverage
        working-directory: packages/app_logging

  # ── 앱별 분석/테스트/빌드 ───────────────────────────
  analyze-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Prepare build
        run: python3 tools/pipeline/pipeline.py prepare --app ${{ matrix.app }}

      - name: Analyze
        run: dart analyze --fatal-warnings
        working-directory: apps/${{ matrix.app }}

      - name: Test with coverage
        run: python3 tools/pipeline/pipeline.py test --app ${{ matrix.app }} --coverage

      - name: Verify coverage threshold
        run: python3 tools/pipeline/verify_coverage.py --app ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}

      - name: Install Linux desktop dependencies
        if: matrix.app == 'daily_memo'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config cmake ninja-build libblkid-dev liblzma-dev xvfb

      - name: Run integration tests
        if: matrix.app == 'daily_memo'
        continue-on-error: true
        run: xvfb-run flutter test integration_test/ -d linux
        working-directory: apps/${{ matrix.app }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.app }}-${{ hashFiles('apps/**/build.gradle*', 'apps/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ matrix.app }}-

      - name: Record build start
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build (release APK)
        run: flutter build apk --release
        working-directory: apps/${{ matrix.app }}

      - name: Record build metrics
        run: |
          BUILD_END=$(date +%s)
          DURATION=$((BUILD_END - BUILD_START))
          echo "### ${{ matrix.app }} Build: ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"

  # ── APK 사이즈 가드레일 ────────────────────────────
  size-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Prepare build
        run: python3 tools/pipeline/pipeline.py prepare --app ${{ matrix.app }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.app }}-${{ hashFiles('apps/**/build.gradle*', 'apps/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ matrix.app }}-

      - name: Build APK and measure size
        run: |
          flutter build apk --release
          APK_PATH=$(find build -name "*.apk" -type f | head -1)
          APK_SIZE_MB=$(du -m "$APK_PATH" | cut -f1)
          echo "APK size: ${APK_SIZE_MB}MB"
          echo "### ${{ matrix.app }} APK Size: ${APK_SIZE_MB}MB" >> "$GITHUB_STEP_SUMMARY"
        working-directory: apps/${{ matrix.app }}

  # ── 의존성 건강 체크 ───────────────────────────────
  dependency-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Check outdated dependencies
        run: |
          echo "## Dependency Health" >> "$GITHUB_STEP_SUMMARY"
          for app in apps/*/; do
            APP_NAME=$(basename "$app")
            echo "### $APP_NAME" >> "$GITHUB_STEP_SUMMARY"
            cd "$app"
            dart pub outdated --no-color 2>/dev/null | head -20 >> "$GITHUB_STEP_SUMMARY" || true
            cd ../..
          done

  # ── 빌드 실패 알림 ─────────────────────────────────
  notify-failure:
    if: failure()
    needs: [analyze-and-test, test-packages]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI Failure: ${context.workflow} #${context.runNumber}`,
              body: `Workflow: ${context.workflow}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure']
            });
