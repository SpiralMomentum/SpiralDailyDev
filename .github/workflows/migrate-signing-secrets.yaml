name: Migrate Signing Secrets (one-time)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build centralized bundle from individual secrets
        env:
          # 기존 개별 Secret
          KEYSTORE_ADAGE_SPARK:       ${{ secrets.ANDROID_KEYSTORE_ADAGE_SPARK_BASE64 }}
          STORE_PASS_ADAGE_SPARK:     ${{ secrets.ANDROID_STORE_PASSWORD_ADAGE_SPARK }}
          KEY_PASS_ADAGE_SPARK:       ${{ secrets.ANDROID_KEY_PASSWORD_ADAGE_SPARK }}
          KEY_ALIAS_ADAGE_SPARK:      ${{ secrets.ANDROID_KEY_ALIAS_ADAGE_SPARK }}

          KEYSTORE_DAILY_MEMO:        ${{ secrets.ANDROID_KEYSTORE_DAILY_MEMO_BASE64 }}
          STORE_PASS_DAILY_MEMO:      ${{ secrets.ANDROID_STORE_PASSWORD_DAILY_MEMO }}
          KEY_PASS_DAILY_MEMO:        ${{ secrets.ANDROID_KEY_PASSWORD_DAILY_MEMO }}
          KEY_ALIAS_DAILY_MEMO:       ${{ secrets.ANDROID_KEY_ALIAS_DAILY_MEMO }}

          KEYSTORE_FILM_ARCHIVE:      ${{ secrets.ANDROID_KEYSTORE_FILM_ARCHIVE_BASE64 }}
          STORE_PASS_FILM_ARCHIVE:    ${{ secrets.ANDROID_STORE_PASSWORD_FILM_ARCHIVE }}
          KEY_PASS_FILM_ARCHIVE:      ${{ secrets.ANDROID_KEY_PASSWORD_FILM_ARCHIVE }}
          KEY_ALIAS_FILM_ARCHIVE:     ${{ secrets.ANDROID_KEY_ALIAS_FILM_ARCHIVE }}

          KEYSTORE_LUCK_INSIGHT:      ${{ secrets.ANDROID_KEYSTORE_LUCK_INSIGHT_BASE64 }}
          STORE_PASS_LUCK_INSIGHT:    ${{ secrets.ANDROID_STORE_PASSWORD_LUCK_INSIGHT }}
          KEY_PASS_LUCK_INSIGHT:      ${{ secrets.ANDROID_KEY_PASSWORD_LUCK_INSIGHT }}
          KEY_ALIAS_LUCK_INSIGHT:     ${{ secrets.ANDROID_KEY_ALIAS_LUCK_INSIGHT }}

          KEYSTORE_NEWS_READER:       ${{ secrets.ANDROID_KEYSTORE_NEWS_READER_BASE64 }}
          STORE_PASS_NEWS_READER:     ${{ secrets.ANDROID_STORE_PASSWORD_NEWS_READER }}
          KEY_PASS_NEWS_READER:       ${{ secrets.ANDROID_KEY_PASSWORD_NEWS_READER }}
          KEY_ALIAS_NEWS_READER:      ${{ secrets.ANDROID_KEY_ALIAS_NEWS_READER }}

          KEYSTORE_WORLD_FIELD_GUIDE: ${{ secrets.ANDROID_KEYSTORE_WORLD_FIELD_GUIDE_BASE64 }}
          STORE_PASS_WORLD_FIELD_GUIDE: ${{ secrets.ANDROID_STORE_PASSWORD_WORLD_FIELD_GUIDE }}
          KEY_PASS_WORLD_FIELD_GUIDE: ${{ secrets.ANDROID_KEY_PASSWORD_WORLD_FIELD_GUIDE }}
          KEY_ALIAS_WORLD_FIELD_GUIDE: ${{ secrets.ANDROID_KEY_ALIAS_WORLD_FIELD_GUIDE }}

          KEYSTORE_WORLD_OF_BEAST:    ${{ secrets.ANDROID_KEYSTORE_WORLD_OF_BEAST_BASE64 }}
          STORE_PASS_WORLD_OF_BEAST:  ${{ secrets.ANDROID_STORE_PASSWORD_WORLD_OF_BEAST }}
          KEY_PASS_WORLD_OF_BEAST:    ${{ secrets.ANDROID_KEY_PASSWORD_WORLD_OF_BEAST }}
          KEY_ALIAS_WORLD_OF_BEAST:   ${{ secrets.ANDROID_KEY_ALIAS_WORLD_OF_BEAST }}

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import base64, io, json, os, tarfile, subprocess

          apps = [
              "adage_spark", "daily_memo", "film_archive",
              "luck_insight", "news_reader", "world_field_guide", "world_of_beast",
          ]

          signing_config = {}
          buf = io.BytesIO()

          with tarfile.open(fileobj=buf, mode="w:gz") as tar:
              for app in apps:
                  key = app.upper()
                  keystore_b64 = os.environ.get(f"KEYSTORE_{key}", "")
                  if not keystore_b64:
                      print(f"  {app}: keystore Secret 없음 — 스킵")
                      continue

                  keystore_data = base64.b64decode(keystore_b64)
                  info = tarfile.TarInfo(name=f"{app}/release.keystore")
                  info.size = len(keystore_data)
                  tar.addfile(info, io.BytesIO(keystore_data))

                  signing_config[app] = {
                      "store_password": os.environ.get(f"STORE_PASS_{key}", ""),
                      "key_password":   os.environ.get(f"KEY_PASS_{key}", ""),
                      "key_alias":      os.environ.get(f"KEY_ALIAS_{key}", app),
                  }
                  print(f"  {app}: 번들에 포함")

          keystores_b64 = base64.b64encode(buf.getvalue()).decode()
          config_json = json.dumps(signing_config, indent=2, ensure_ascii=False)

          print(f"\n총 {len(signing_config)}개 앱 번들 완성: {list(signing_config)}")

          # GitHub Secrets 업로드
          repo = subprocess.run(
              ["gh", "repo", "view", "--json", "nameWithOwner", "-q", ".nameWithOwner"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          for name, value in [
              ("ANDROID_SIGNING_CONFIG", config_json),
              ("ANDROID_KEYSTORES_BASE64", keystores_b64),
          ]:
              subprocess.run(
                  ["gh", "secret", "set", name, "--repo", repo],
                  input=value, check=True, capture_output=True, text=True,
              )
              print(f"  {name} 업로드 완료")

          print("\n마이그레이션 완료.")
          EOF
