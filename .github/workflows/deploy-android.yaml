name: Deploy Android

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App name (release.yaml에 등록된 snake_case 이름)"
        required: true
        type: string
      track:
        description: "Play Store track"
        required: true
        type: choice
        options:
          - internal
          - production
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      track:
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app name
        run: python3 -c "import yaml,sys; assert '${{ inputs.app }}' in yaml.safe_load(open('release.yaml'))['apps'], f'Unknown app: ${{ inputs.app }}'"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Compute uppercase app name
        run: |
          APP_UPPER=$(echo "${{ inputs.app }}" | tr '[:lower:]' '[:upper:]')
          echo "APP_UPPER=$APP_UPPER" >> "$GITHUB_ENV"

      - name: Generate signing files
        run: |
          SIGNING_DIR="signing/${{ inputs.app }}/android"
          mkdir -p "$SIGNING_DIR"

          echo "${{ secrets[format('ANDROID_KEYSTORE_{0}_BASE64', env.APP_UPPER)] }}" | base64 --decode > "$SIGNING_DIR/release.keystore"

          KEYSTORE_ABS="$(cd "$SIGNING_DIR" && pwd)/release.keystore"

          cat > "$SIGNING_DIR/key.properties" << EOF
          storePassword=${{ secrets[format('ANDROID_STORE_PASSWORD_{0}', env.APP_UPPER)] }}
          keyPassword=${{ secrets[format('ANDROID_KEY_PASSWORD_{0}', env.APP_UPPER)] }}
          keyAlias=${{ secrets[format('ANDROID_KEY_ALIAS_{0}', env.APP_UPPER)] }}
          storeFile=$KEYSTORE_ABS
          EOF

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets[format('GOOGLE_SERVICES_JSON_{0}', env.APP_UPPER)] }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > apps/${{ inputs.app }}/android/app/google-services.json

      - name: Deploy to Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 tools/pipeline/pipeline.py deploy --app ${{ inputs.app }} --platform android --target ${{ inputs.track }}
