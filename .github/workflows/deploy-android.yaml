name: Deploy Android

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy"
        required: true
        type: choice
        options:
          - adage_spark
          - daily_memo
          - film_archive
          - luck_insight
          - spiral_trade_show
          - world_field_guide
          - world_of_beast
      track:
        description: "Play Store track"
        required: true
        type: choice
        options:
          - internal
          - production
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      track:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Compute uppercase app name
        run: |
          APP_UPPER=$(echo "${{ inputs.app }}" | tr '[:lower:]' '[:upper:]')
          echo "APP_UPPER=$APP_UPPER" >> "$GITHUB_ENV"

      - name: Generate signing files
        run: |
          SIGNING_DIR="signing/${{ inputs.app }}/android"
          mkdir -p "$SIGNING_DIR"

          echo "${{ secrets[format('ANDROID_KEYSTORE_{0}_BASE64', env.APP_UPPER)] }}" | base64 --decode > "$SIGNING_DIR/release.keystore"

          cat > "$SIGNING_DIR/key.properties" << EOF
          storePassword=${{ secrets[format('ANDROID_STORE_PASSWORD_{0}', env.APP_UPPER)] }}
          keyPassword=${{ secrets[format('ANDROID_KEY_PASSWORD_{0}', env.APP_UPPER)] }}
          keyAlias=${{ secrets[format('ANDROID_KEY_ALIAS_{0}', env.APP_UPPER)] }}
          storeFile=../../../../signing/${{ inputs.app }}/android/release.keystore
          EOF

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets[format('GOOGLE_SERVICES_JSON_{0}', env.APP_UPPER)] }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > apps/${{ inputs.app }}/android/app/google-services.json

      - name: Build app bundle
        run: flutter build appbundle --release
        working-directory: apps/${{ inputs.app }}

      - name: Deploy to Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ inputs.track }}" = "internal" ]; then
            bundle exec fastlane android deploy_internal app:${{ inputs.app }}
          else
            bundle exec fastlane android deploy_production app:${{ inputs.app }}
          fi
