name: Deploy Android

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App name (release.yaml에 등록된 snake_case 이름)"
        required: true
        type: string
      track:
        description: "Play Store track"
        required: true
        type: choice
        options:
          - internal
          - production
      release_status:
        description: "Play 출시 상태 (한 번도 게시하지 않은 앱은 draft 만 가능)"
        required: false
        default: completed
        type: choice
        options:
          - completed
          - draft
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      track:
        required: true
        type: string
      release_status:
        required: false
        default: completed
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: pip3 install -r tools/ci/requirements.txt
      - name: Validate app name
        env:
          APPS_FILTER: ${{ inputs.app }}
        run: |
          python3 tools/ci/list_apps.py | grep -q "\"$APPS_FILTER\"" || { echo "Unknown app: $APPS_FILTER"; exit 1; }

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Android NDK
        run: echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Compute uppercase app name
        run: |
          APP_UPPER=$(echo "${{ inputs.app }}" | tr '[:lower:]' '[:upper:]')
          echo "APP_UPPER=$APP_UPPER" >> "$GITHUB_ENV"

      - name: Generate signing files
        env:
          APP: ${{ inputs.app }}
          ANDROID_KEYSTORES_BASE64: ${{ secrets.ANDROID_KEYSTORES_BASE64 }}
          ANDROID_SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
          KEYSTORE_LEGACY: ${{ secrets[format('ANDROID_KEYSTORE_{0}_BASE64', env.APP_UPPER)] }}
          STORE_PASSWORD_LEGACY: ${{ secrets[format('ANDROID_STORE_PASSWORD_{0}', env.APP_UPPER)] }}
          KEY_PASSWORD_LEGACY: ${{ secrets[format('ANDROID_KEY_PASSWORD_{0}', env.APP_UPPER)] }}
          KEY_ALIAS_LEGACY: ${{ secrets[format('ANDROID_KEY_ALIAS_{0}', env.APP_UPPER)] }}
        run: python3 tools/ci/signing_files.py

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets[format('GOOGLE_SERVICES_JSON_{0}', env.APP_UPPER)] }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > apps/${{ inputs.app }}/android/app/google-services.json

      - name: Install Python dependencies
        run: pip3 install -r tools/ci/requirements.txt

      - name: Deploy to Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          APP: ${{ inputs.app }}
          TRACK: ${{ inputs.track }}
          PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
        run: python3 tools/ci/pipeline.py deploy --app "$APP" --platform android --target "$TRACK"
