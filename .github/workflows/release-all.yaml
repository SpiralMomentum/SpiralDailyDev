name: Release All Apps

on:
  push:
    tags:
      - 'release/*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 앱 목록을 release.yaml에서 동적 생성 ──────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      all-apps: ${{ steps.matrix.outputs.all-apps }}
      deploy-apps: ${{ steps.matrix.outputs.deploy-apps }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate app matrices
        id: matrix
        run: python3 tools/pipeline/list_apps.py

  # ── 릴리즈 전 회귀 테스트 게이트 ────────────────────────
  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: ${{ fromJson(needs.setup.outputs.all-apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Prepare and test
        run: python3 tools/pipeline/pipeline.py test --app ${{ matrix.app }} --coverage

  # ── Android Play Store 배포 ───────────────────────────
  deploy-android:
    needs: [setup, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup.outputs.deploy-apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Compute uppercase app name
        run: |
          APP_UPPER=$(echo "${{ matrix.app }}" | tr '[:lower:]' '[:upper:]')
          echo "APP_UPPER=$APP_UPPER" >> "$GITHUB_ENV"

      - name: Generate signing files
        run: |
          SIGNING_DIR="signing/${{ matrix.app }}/android"
          mkdir -p "$SIGNING_DIR"

          echo "${{ secrets[format('ANDROID_KEYSTORE_{0}_BASE64', env.APP_UPPER)] }}" | base64 --decode > "$SIGNING_DIR/release.keystore"

          KEYSTORE_ABS="$(cd "$SIGNING_DIR" && pwd)/release.keystore"

          cat > "$SIGNING_DIR/key.properties" << EOF
          storePassword=${{ secrets[format('ANDROID_STORE_PASSWORD_{0}', env.APP_UPPER)] }}
          keyPassword=${{ secrets[format('ANDROID_KEY_PASSWORD_{0}', env.APP_UPPER)] }}
          keyAlias=${{ secrets[format('ANDROID_KEY_ALIAS_{0}', env.APP_UPPER)] }}
          storeFile=$KEYSTORE_ABS
          EOF

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets[format('GOOGLE_SERVICES_JSON_{0}', env.APP_UPPER)] }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > apps/${{ matrix.app }}/android/app/google-services.json

      - name: Deploy to Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 tools/pipeline/pipeline.py deploy --app ${{ matrix.app }} --platform android --target production

  # ── iOS App Store 배포 ────────────────────────────────
  deploy-ios:
    needs: [setup, test]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: ${{ fromJson(needs.setup.outputs.deploy-apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          # Remove broken system CocoaPods that conflict with setup-ruby
          sudo rm -f /usr/local/bin/pod /usr/local/bin/xcodeproj
          brew uninstall cocoapods 2>/dev/null || true
          gem install cocoapods --no-document
          which pod
          pod --version

      - name: Setup SSH for match
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Deploy to App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: python3 tools/pipeline/pipeline.py deploy --app ${{ matrix.app }} --platform ios --target appstore

  # ── 빌드 실패 알림 ─────────────────────────────────
  notify-failure:
    if: failure()
    needs: [test, deploy-android, deploy-ios]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release Failure: ${context.workflow} #${context.runNumber}`,
              body: `Workflow: ${context.workflow}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure']
            });
