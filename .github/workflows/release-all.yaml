name: Release All Apps

on:
  push:
    tags:
      - 'release/*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 릴리즈 전 회귀 테스트 게이트 ────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app:
          - adage_spark
          - daily_memo
          - film_archive
          - luck_insight
          - spiral_trade_show
          - world_field_guide
          - world_of_beast
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Test
        run: flutter test
        working-directory: apps/${{ matrix.app }}

  # ── Android 7개 앱 Play Store 배포 ──────────────────────
  deploy-android:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - adage_spark
          - daily_memo
          - film_archive
          - luck_insight
          - spiral_trade_show
          - world_field_guide
          - world_of_beast
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Compute uppercase app name
        run: |
          APP_UPPER=$(echo "${{ matrix.app }}" | tr '[:lower:]' '[:upper:]')
          echo "APP_UPPER=$APP_UPPER" >> "$GITHUB_ENV"

      - name: Generate signing files
        run: |
          SIGNING_DIR="signing/${{ matrix.app }}/android"
          mkdir -p "$SIGNING_DIR"

          echo "${{ secrets[format('ANDROID_KEYSTORE_{0}_BASE64', env.APP_UPPER)] }}" | base64 --decode > "$SIGNING_DIR/release.keystore"

          cat > "$SIGNING_DIR/key.properties" << EOF
          storePassword=${{ secrets[format('ANDROID_STORE_PASSWORD_{0}', env.APP_UPPER)] }}
          keyPassword=${{ secrets[format('ANDROID_KEY_PASSWORD_{0}', env.APP_UPPER)] }}
          keyAlias=${{ secrets[format('ANDROID_KEY_ALIAS_{0}', env.APP_UPPER)] }}
          storeFile=../../../../signing/${{ matrix.app }}/android/release.keystore
          EOF

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets[format('GOOGLE_SERVICES_JSON_{0}', env.APP_UPPER)] }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > apps/${{ matrix.app }}/android/app/google-services.json

      - name: Build app bundle
        run: flutter build appbundle --release
        working-directory: apps/${{ matrix.app }}

      - name: Deploy to Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android deploy_production app:${{ matrix.app }}

  # ── iOS 7개 앱 App Store 배포 ───────────────────────────
  deploy-ios:
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app:
          - adage_spark
          - daily_memo
          - film_archive
          - luck_insight
          - spiral_trade_show
          - world_field_guide
          - world_of_beast
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup SSH for match
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Deploy to App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios deploy_appstore app:${{ matrix.app }}
