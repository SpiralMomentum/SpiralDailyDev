name: Release All Apps

on:
  push:
    tags:
      - 'release/*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 릴리즈 전 회귀 테스트 게이트 ────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app:
          - adage_spark
          - daily_memo
          - film_archive
          - luck_insight
          - news_reader
          - spiral_trade_show
          - world_field_guide
          - world_of_beast
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Test
        run: flutter test
        working-directory: apps/${{ matrix.app }}

  # ── Android 6개 앱 Play Store 배포 ──────────────────────
  # spiral_trade_show 제외: Play Store 미등록
  deploy-android:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - adage_spark
          - daily_memo
          - film_archive
          - luck_insight
          - news_reader
          - world_field_guide
          - world_of_beast
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Compute uppercase app name
        run: |
          APP_UPPER=$(echo "${{ matrix.app }}" | tr '[:lower:]' '[:upper:]')
          echo "APP_UPPER=$APP_UPPER" >> "$GITHUB_ENV"

      - name: Generate signing files
        run: |
          SIGNING_DIR="signing/${{ matrix.app }}/android"
          mkdir -p "$SIGNING_DIR"

          echo "${{ secrets[format('ANDROID_KEYSTORE_{0}_BASE64', env.APP_UPPER)] }}" | base64 --decode > "$SIGNING_DIR/release.keystore"

          KEYSTORE_ABS="$(cd "$SIGNING_DIR" && pwd)/release.keystore"

          cat > "$SIGNING_DIR/key.properties" << EOF
          storePassword=${{ secrets[format('ANDROID_STORE_PASSWORD_{0}', env.APP_UPPER)] }}
          keyPassword=${{ secrets[format('ANDROID_KEY_PASSWORD_{0}', env.APP_UPPER)] }}
          keyAlias=${{ secrets[format('ANDROID_KEY_ALIAS_{0}', env.APP_UPPER)] }}
          storeFile=$KEYSTORE_ABS
          EOF

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets[format('GOOGLE_SERVICES_JSON_{0}', env.APP_UPPER)] }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > apps/${{ matrix.app }}/android/app/google-services.json

      - name: Generate gitignored source files
        run: |
          # film_archive: tmdb_api_key.dart (reads key from --dart-define at build time)
          if [ "${{ matrix.app }}" = "film_archive" ]; then
            echo "const tmdbApiKey = String.fromEnvironment('TMDB_API_KEY', defaultValue: '');" \
              > apps/film_archive/lib/tmdb_api_key.dart
          fi

      - name: Deploy to Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android deploy_production app:${{ matrix.app }}

  # ── iOS 6개 앱 App Store 배포 ───────────────────────────
  # spiral_trade_show 제외: App Store 미등록
  deploy-ios:
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app:
          - adage_spark
          - daily_memo
          - film_archive
          - luck_insight
          - news_reader
          - world_field_guide
          - world_of_beast
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          # Remove broken system CocoaPods that conflict with setup-ruby
          sudo rm -f /usr/local/bin/pod /usr/local/bin/xcodeproj
          brew uninstall cocoapods 2>/dev/null || true
          gem install cocoapods --no-document
          which pod
          pod --version

      - name: Setup SSH for match
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Generate gitignored source files
        run: |
          if [ "${{ matrix.app }}" = "film_archive" ]; then
            echo "const tmdbApiKey = String.fromEnvironment('TMDB_API_KEY', defaultValue: '');" \
              > apps/film_archive/lib/tmdb_api_key.dart
          fi

      - name: Deploy to App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios deploy_appstore app:${{ matrix.app }}

  # ── 빌드 실패 알림 ─────────────────────────────────
  notify-failure:
    if: failure()
    needs: [test, deploy-android, deploy-ios]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release Failure: ${context.workflow} #${context.runNumber}`,
              body: `Workflow: ${context.workflow}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure']
            });
