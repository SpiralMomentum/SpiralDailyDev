name: Release All Apps

on:
  push:
    tags:
      - 'release/*'
  workflow_dispatch:
    inputs:
      apps_filter:
        description: '배포할 앱 (쉼표 구분, 비워두면 전체). 예: news_reader,daily_memo'
        required: false
        default: ''
      platforms:
        description: '배포 플랫폼 (android, ios, both)'
        required: false
        default: 'both'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 앱 목록을 release.yaml에서 동적 생성 ──────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      all-apps: ${{ steps.matrix.outputs.all-apps }}
      deploy-apps: ${{ steps.matrix.outputs.deploy-apps }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate app matrices
        id: matrix
        env:
          APPS_FILTER: ${{ github.event.inputs.apps_filter || '' }}
        run: python3 tools/pipeline/list_apps.py

  # ── 릴리즈 전 회귀 테스트 게이트 ────────────────────────
  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: ${{ fromJson(needs.setup.outputs.all-apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Prepare and test
        run: python3 tools/pipeline/pipeline.py test --app ${{ matrix.app }} --coverage

  # ── Android Play Store 배포 ───────────────────────────
  deploy-android:
    needs: [setup, test]
    if: ${{ github.event.inputs.platforms != 'ios' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup.outputs.deploy-apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Android NDK
        run: echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Compute uppercase app name
        run: |
          APP_UPPER=$(echo "${{ matrix.app }}" | tr '[:lower:]' '[:upper:]')
          echo "APP_UPPER=$APP_UPPER" >> "$GITHUB_ENV"

      - name: Generate signing files
        env:
          ANDROID_KEYSTORES_BASE64: ${{ secrets.ANDROID_KEYSTORES_BASE64 }}
          ANDROID_SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
          APP: ${{ matrix.app }}
          # 구 방식 fallback (마이그레이션 완료 전까지 유지)
          KEYSTORE_LEGACY: ${{ secrets[format('ANDROID_KEYSTORE_{0}_BASE64', env.APP_UPPER)] }}
          STORE_PASSWORD_LEGACY: ${{ secrets[format('ANDROID_STORE_PASSWORD_{0}', env.APP_UPPER)] }}
          KEY_PASSWORD_LEGACY: ${{ secrets[format('ANDROID_KEY_PASSWORD_{0}', env.APP_UPPER)] }}
          KEY_ALIAS_LEGACY: ${{ secrets[format('ANDROID_KEY_ALIAS_{0}', env.APP_UPPER)] }}
        run: |
          python3 - << 'EOF'
          import base64, io, json, os, tarfile

          app = os.environ['APP']
          signing_dir = f"signing/{app}/android"
          os.makedirs(signing_dir, exist_ok=True)
          keystore_path = os.path.abspath(f"{signing_dir}/release.keystore")

          bundle_b64 = os.environ.get('ANDROID_KEYSTORES_BASE64', '')
          config_json = os.environ.get('ANDROID_SIGNING_CONFIG', '')

          # 신 방식: 번들에서 추출
          if bundle_b64 and config_json:
              config = json.loads(config_json)
              if app in config:
                  bundle = base64.b64decode(bundle_b64)
                  with tarfile.open(fileobj=io.BytesIO(bundle)) as tar:
                      try:
                          member = tar.getmember(f"{app}/release.keystore")
                          with tar.extractfile(member) as f:
                              with open(keystore_path, 'wb') as out:
                                  out.write(f.read())
                          cfg = config[app]
                          with open(f"{signing_dir}/key.properties", 'w') as f:
                              f.write(f"storePassword={cfg['store_password']}\n")
                              f.write(f"keyPassword={cfg['key_password']}\n")
                              f.write(f"keyAlias={cfg['key_alias']}\n")
                              f.write(f"storeFile={keystore_path}\n")
                          print(f"[signing] {app}: 중앙 번들 사용")
                          exit(0)
                      except KeyError:
                          pass  # 번들에 없으면 fallback

          # 구 방식 fallback
          keystore_b64 = os.environ.get('KEYSTORE_LEGACY', '')
          if not keystore_b64:
              print(f"[signing] 오류: {app} keystore를 찾을 수 없습니다", flush=True)
              exit(1)

          with open(keystore_path, 'wb') as f:
              f.write(base64.b64decode(keystore_b64))
          with open(f"{signing_dir}/key.properties", 'w') as f:
              f.write(f"storePassword={os.environ['STORE_PASSWORD_LEGACY']}\n")
              f.write(f"keyPassword={os.environ['KEY_PASSWORD_LEGACY']}\n")
              f.write(f"keyAlias={os.environ['KEY_ALIAS_LEGACY']}\n")
              f.write(f"storeFile={keystore_path}\n")
          print(f"[signing] {app}: 개별 Secret 사용 (마이그레이션 필요)")
          EOF

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets[format('GOOGLE_SERVICES_JSON_{0}', env.APP_UPPER)] }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > apps/${{ matrix.app }}/android/app/google-services.json

      - name: Install Python dependencies
        run: pip3 install -r tools/pipeline/requirements.txt

      - name: Deploy to Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 tools/pipeline/pipeline.py deploy --app ${{ matrix.app }} --platform android --target production

  # ── iOS App Store 배포 ────────────────────────────────
  deploy-ios:
    needs: [setup, test]
    if: ${{ github.event.inputs.platforms != 'android' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: ${{ fromJson(needs.setup.outputs.deploy-apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          # Remove broken system CocoaPods that conflict with setup-ruby
          sudo rm -f /usr/local/bin/pod /usr/local/bin/xcodeproj
          brew uninstall cocoapods 2>/dev/null || true
          gem install cocoapods --no-document
          which pod
          pod --version

      - name: Setup SSH for match
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Install Python dependencies
        run: pip3 install --break-system-packages -r tools/pipeline/requirements.txt

      - name: Deploy to App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: python3 tools/pipeline/pipeline.py deploy --app ${{ matrix.app }} --platform ios --target appstore

  # ── 빌드 실패 알림 ─────────────────────────────────
  notify-failure:
    if: failure()
    needs: [test, deploy-android, deploy-ios]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release Failure: ${context.workflow} #${context.runNumber}`,
              body: `Workflow: ${context.workflow}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure']
            });
